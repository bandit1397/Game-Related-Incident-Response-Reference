<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d3a8a">
<meta name="description" content="게임 관련 112신고 출동 시 장소별 체크리스트·위반유형·적용법조·조치를 찾아보는 지구대·파출소용 현장 매뉴얼">
<title>게임신고 현장매뉴얼</title>
<style>
:root{
  --bg:#f3f5f8; --card:#fff; --ink:#151a21; --muted:#5a6472; --line:#dde2e8;
  --brand:#1d3a8a; --brand2:#2f5bd3; --brand-soft:#e7eeff;
  --red:#b42318; --red-soft:#fdeceb; --amber:#a15c07; --amber-soft:#fff3dc;
  --blue:#1f5fbf; --blue-soft:#e6f0ff; --green:#137a3b; --green-soft:#e3f5ea;
  --gray-soft:#edf0f4; --shadow:0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --card:#171b22; --ink:#e7eaef; --muted:#98a2b0; --line:#29303a;
    --brand:#9db6ff; --brand2:#7ea0ff; --brand-soft:#1b2542;
    --red:#ff8a80; --red-soft:#3b1d1d; --amber:#ffbe5c; --amber-soft:#382a12;
    --blue:#8ab8ff; --blue-soft:#162a46; --green:#6bd690; --green-soft:#15301f;
    --gray-soft:#20252d; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116; --card:#171b22; --ink:#e7eaef; --muted:#98a2b0; --line:#29303a;
  --brand:#9db6ff; --brand2:#7ea0ff; --brand-soft:#1b2542;
  --red:#ff8a80; --red-soft:#3b1d1d; --amber:#ffbe5c; --amber-soft:#382a12;
  --blue:#8ab8ff; --blue-soft:#162a46; --green:#6bd690; --green-soft:#15301f;
  --gray-soft:#20252d; --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.6 "Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;padding-bottom:calc(68px + env(safe-area-inset-bottom))}
a{color:var(--brand2);text-decoration:none}
header.top{position:sticky;top:0;z-index:10;background:var(--brand);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px}
:root[data-theme="dark"] header.top{background:#16213f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header.top{background:#16213f}}
header.top .back{background:none;border:0;color:#fff;font-size:22px;padding:0 6px 0 0;cursor:pointer;display:none}
header.top h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .icon{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;width:36px;height:36px;font-size:16px;cursor:pointer}
.searchbar{padding:10px 16px;background:var(--bg);position:sticky;top:56px;z-index:9;display:none}
.searchbar input{width:100%;font:inherit;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
main{max-width:760px;margin:0 auto;padding:12px 16px 24px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom a{flex:1;text-align:center;padding:8px 0 7px;color:var(--muted);font-size:12px;line-height:1.2}
nav.bottom a b{display:block;font-size:19px;line-height:1.3;font-weight:400}
nav.bottom a.on{color:var(--brand2);font-weight:700}
h2{font-size:19px;margin:6px 0 10px}
h3{font-size:16px;margin:20px 0 8px;display:flex;align-items:center;gap:6px}
h3 .num{background:var(--brand2);color:#fff;border-radius:6px;font-size:12px;padding:1px 7px}
p{margin:6px 0}
.muted{color:var(--muted)} .small{font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;box-shadow:var(--shadow)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;color:var(--ink);box-shadow:var(--shadow)}
.item .ic{font-size:24px;width:34px;text-align:center;flex:none}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:15.5px}
.item .tx span{display:block;font-size:13px;color:var(--muted)}
.item .ar{color:var(--muted);font-size:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 14px;color:var(--ink);min-height:96px;box-shadow:var(--shadow)}
.big b{font-size:16px} .big span{font-size:12.5px;color:var(--muted)} .big i{font-style:normal;font-size:26px}
.sec-label{font-size:13px;font-weight:700;color:var(--muted);margin:18px 2px 6px;letter-spacing:.02em}
.bd{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap;vertical-align:1px}
.k-c{background:var(--red-soft);color:var(--red)} .k-f{background:var(--amber-soft);color:var(--amber)}
.k-a{background:var(--blue-soft);color:var(--blue)} .k-x{background:var(--gray-soft);color:var(--muted)}
.k-ok{background:var(--green-soft);color:var(--green)}
.box{border-radius:10px;padding:11px 13px;margin:10px 0;font-size:14.5px}
.box.warn{background:var(--amber-soft);border-left:4px solid var(--amber)}
.box.stop{background:var(--red-soft);border-left:4px solid var(--red)}
.box.ok{background:var(--green-soft);border-left:4px solid var(--green)}
.box.info{background:var(--blue-soft);border-left:4px solid var(--blue)}
.box ul{margin:4px 0 0;padding-left:18px} .box li{margin:3px 0}
ul.tight{margin:4px 0;padding-left:20px} ul.tight li{margin:4px 0}
.chk{display:flex;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.chk input{width:22px;height:22px;margin-top:1px;flex:none;accent-color:var(--green)}
.chk .q{font-weight:700}
.chk .how{font-size:13.5px;color:var(--muted);margin-top:2px}
.chk.done .q{color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--ink);background:var(--bg)}
.progress{height:6px;background:var(--gray-soft);border-radius:4px;overflow:hidden;margin:4px 0 2px}
.progress i{display:block;height:100%;background:var(--green);width:0;transition:width .2s}
details.v{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:8px 0;box-shadow:var(--shadow);scroll-margin-top:70px}
details.v summary{list-style:none;padding:12px 14px;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
details.v summary::-webkit-details-marker{display:none}
details.v summary .t{flex:1;font-weight:700;font-size:15px}
details.v summary .t small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:2px}
details.v[open] summary{border-bottom:1px solid var(--line)}
details.v .bd-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.kv{padding:10px 14px;font-size:14px}
.kv div{display:grid;grid-template-columns:64px 1fr;gap:8px;padding:4px 0}
.kv div>span:first-child{color:var(--muted);font-size:13px}
.flash{animation:fl 1.4s}
@keyframes fl{0%{box-shadow:0 0 0 3px var(--brand2)}100%{box-shadow:0 0 0 0 transparent}}
.step{display:flex;gap:12px}
.step .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--brand2);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.step .b{flex:1;padding-bottom:16px;border-left:2px solid var(--line);margin-left:-26px;padding-left:38px}
.step:last-child .b{border-left-color:transparent}
.step .b b{display:block;margin-bottom:2px}
.ladder div{border-radius:9px;padding:9px 12px;margin:6px 0;font-size:14.5px}
.fork{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.fork div{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;font-size:14px}
.fork .c{background:var(--gray-soft);border-radius:8px;padding:8px 10px}
.fork .r{border-radius:8px;padding:8px 10px}
.fork .arrow{color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{background:var(--gray-soft);white-space:nowrap}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
.filter{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
.filter button{flex:none;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.filter button.on{background:var(--brand2);color:#fff;border-color:var(--brand2)}
.quote{background:var(--gray-soft);border-radius:8px;padding:10px 12px;font-size:14px;margin:6px 0;white-space:pre-wrap}
.copy{float:right;font:inherit;font-size:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:2px 8px;cursor:pointer}
footer{font-size:12px;color:var(--muted);text-align:center;padding:16px}
.hit mark{background:#ffe58a;color:#000;border-radius:2px}
a.lref{color:var(--brand2);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;font-weight:700;white-space:nowrap;cursor:pointer}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--card);border-radius:16px 16px 0 0;max-height:82vh;display:none;flex-direction:column;max-width:760px;margin:0 auto;box-shadow:0 -4px 20px rgba(0,0,0,.2);padding-bottom:env(safe-area-inset-bottom)}
.sheet.on,.sheet-bg.on{display:flex}
.sheet .sh-h{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet .sh-h div{flex:1}
.sheet .sh-h small{display:block;color:var(--muted);font-size:12.5px}
.sheet .sh-h b{font-size:16px}
.sheet .sh-x{background:var(--gray-soft);border:0;color:var(--ink);border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer;flex:none}
.sheet .sh-b{overflow-y:auto;padding:10px 16px 6px;font-size:14.5px;line-height:1.65}
.sheet .ln{padding:4px 8px;border-radius:6px;margin:1px 0}
.sheet .l0{font-weight:700}
.sheet .l2{padding-left:20px} .sheet .l3{padding-left:36px;color:var(--muted)}
.sheet .ln.hl{background:#fff1b8;color:#1a1a1a}
.sheet .sh-f{padding:10px 16px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
@media print{nav.bottom,header.top,.searchbar{display:none}body{padding:0}}
</style>
</head>
<body>
<header class="top">
  <button class="back" id="back" aria-label="뒤로">‹</button>
  <h1 id="ttl">게임신고 현장매뉴얼</h1>
  <button class="icon" id="sbtn" aria-label="검색">🔍</button>
  <button class="icon" id="theme" aria-label="화면 밝기 전환">◐</button>
</header>
<div class="searchbar" id="sbar"><input id="q" type="search" placeholder="예: 환전, 인형뽑기, 청소년, 홀덤, 차단프로그램" autocomplete="off"></div>
<main id="app"></main>
<div class="sheet-bg" id="shbg"></div>

  <div class="sh-f"><span id="shD"></span><a id="shA" target="_blank" rel="noopener">국가법령정보센터에서 보기 ↗</a></div>
</div>
<nav class="bottom" id="nav">

 바에 따라 24시간 이내에 이를 위원회에 신고하여야 한다. 이 경우 위원회는 신고된 내용이 등급의 변경이 필요할 정도로 수정된 경우에는 신고를 받은 날부터 7일 이내에 등급 재분류 대상임을 통보하여야 하며, 통보받은 게임물은 새로운 게임물로 간주하여 위원회규정으로 정하는 절차에 따라 새로이 등급분류를 받도록 조치하여야 한다."],[1,"⑥제5항의 규정에 따라 등급의 변경이 필요할 정도의 수정에 해당하면서 새로이 등급분류를 받지 아니하거나 등급분류를 받은 내용과 다르게 제공할 경우 위원회에서 직권으로 조사하거나 게임물제공업자 또는 게임물배급업자의 신청에 의하여 등급을 재분류 할 수 있다."],[1,"⑦제1항 및 제2항에 따른 등급분류 기준과 제4항에 따른 사행성 확인 기준 등에 관하여 필요한 사항은 문화체육관광부령으로 정한다."],[1,"⑧위원회는 게임물의 사행성 여부 등을 확인하기 위하여 대통령령으로 정하는 바에 따라 기술심의를 할 수 있다."],[1,"⑨ 제24조의2에 따라 등급분류 업무를 위탁받은 기관(이하 \"등급분류기관\"이라 한다)의 등급분류 결정이 제7항의 등급분류 기준에 적합하지 아니한 경우 위원회는 직권으로 등급분류를 할 수 있다."]],"game:26":[[0,"제26조(게임제공업 등의 허가 등)"],[1,"①일반게임제공업을 영위하고자 하는 자는 허가의 기준ㆍ절차 등에 관하여 대통령령으로 정하는 바에 따라 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장의 허가를 받아 영업을 할 수 있다. 다만, 「국토의 계획 및 이용에 관한 법률」 제36조제1항제1호가목의 주거지역에 위치하여서는 아니 된다."],[1,"②청소년게임제공업 또는 인터넷컴퓨터게임시설제공업을 영위하고자 하는 자는 문화체육관광부령으로 정하는 시설을 갖추어 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장에게 등록하여야 한다. 다만, 정보통신망을 통하여 게임물을 제공하는 자로서 「전기통신사업법」에 따라 신고 또는 등록을 한 경우에는 이 법에 의하여 등록한 것으로 본다."],[1,"③복합유통게임제공업을 영위하고자 하는 자는 문화체육관광부령으로 정하는 바에 따라 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장에게 등록하여야 한다. 다만, 제2항에 따라 청소년게임제공업 또는 인터넷컴퓨터게임시설제공업의 등록을 한 자가 복합유통게임제공업을 영위하고자 하는 때에는 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장에게 신고하여야 한다."],[1,"④제1항부터 제3항까지에 따라 허가를 받거나 등록 또는 신고를 한 자가 문화체육관광부령으로 정하는 중요사항을 변경하고자 하는 경우에는 변경허가를 하거나 변경등록 또는 변경신고를 하여야 한다."],[1,"⑤ 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장은 제3항 단서에 따른 신고 또는 제4항에 따른 변경허가ㆍ변경등록의 신청을 받거나 변경신고를 받은 날부터 15일 이내에 신고수리 또는 변경허가ㆍ변경등록ㆍ변경신고수리 여부를 신청인에게 통지하여야 한다."],[1,"⑥ 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장이 제5항에서 정한 기간 내에 신고수리 또는 변경허가ㆍ변경등록ㆍ변경신고수리 여부나 민원 처리 관련 법령에 따른 처리기간의 연장을 신청인에게 통지하지 아니하면 그 기간(민원 처리 관련 법령에 따라 처리기간이 연장 또는 재연장된 경우에는 해당 처리기간을 말한다)이 끝난 날의 다음 날에 신고수리 또는 변경허가ㆍ변경등록ㆍ변경신고수리를 한 것으로 본다."],[1,"⑦특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장은 제1항부터 제4항까지의 규정에 따른 허가ㆍ변경허가를 하거나 등록ㆍ변경등록 또는 신고ㆍ변경신고를 받은 경우(제6항에 따라 신고수리 또는 변경허가ㆍ변경등록ㆍ변경신고수리를 한 것으로 보는 경우를 포함한다)에는 문화체육관광부령으로 정하는 바에 따라 신청인에게 허가증 또는 등록증ㆍ신고증을 교부하여야 한다."]],"game:28":[[0,"제28조(게임물 관련사업자의 준수사항)"],[1,"① 게임물 관련사업자는 다음 각 호의 사항을 지켜야 한다."],[2,"1. 제9조제3항에 따른 유통질서 등에 관한 교육을 받을 것"],[2,"2. 게임물을 이용하여 도박 그 밖의 사행행위를 하게 하거나 이를 하도록 내버려 두지 아니할 것"],[2,"2의2. 게임머니의 화폐단위를 한국은행에서 발행되는 화폐단위와 동일하게 하는 등 게임물의 내용구현과 밀접한 관련이 있는 운영방식 또는 기기ㆍ장치 등을 통하여 사행성을 조장하지 아니할 것"],[2,"3. 경품 등을 제공하여 사행성을 조장하지 아니할 것. 다만, 청소년게임제공업의 전체이용가 게임물에 대하여 대통령령으로 정하는 경품의 종류(완구류 및 문구류 등. 다만, 현금, 상품권 및 유가증권은 제외한다)ㆍ지급기준ㆍ제공방법 등에 의한 경우에는 그러하지 아니하다."],[2,"4. 제2조제6호의2가목의 규정에 따른 청소년게임제공업을 영위하는 자는 청소년이용불가 게임물을 제공하지 아니할 것"],[2,"5. 제2조제6호의2나목의 규정에 따른 일반게임제공업 또는 제2조제8호에 따른 복합유통게임제공업(「청소년 보호법」에 따라 청소년 출입을 허용하는 경우는 제외한다)을 영위하는 자는 게임장에 청소년을 출입시키지 아니할 것"],[2,"5의2. 인터넷컴퓨터게임시설제공업을 영위하는 자는 이용자가 제21조제2항 각 호의 등급구분을 위반하여 게임물을 이용하지 아니하도록 할 것"],[2,"6. 게임물 및 컴퓨터 설비 등에 문화체육관광부장관이 고시하는 음란물 및 사행성게임물 차단 프로그램 또는 장치를 설치할 것. 다만, 음란물 및 사행성게임물 차단 프로그램 또는 장치를 설치하지 아니하여도 음란물 및 사행성게임물을 접속할 수 없게 되어 있는 경우에는 그러하지 아니하다."],[2,"7. 대통령령으로 정하는 영업시간 및 청소년의 출입시간을 준수할 것"],[2,"8. 그 밖에 영업질서의 유지 등에 관하여 필요한 사항으로서 대통령령으로 정하는 사항을 준수할 것"],[1,"② 게임물 관련사업자는 제1항제5호ㆍ제5호의2의 사항 및 같은 항 제7호 중 청소년의 출입시간에 관한 사항을 준수하기 위하여 필요한 경우 출입자 또는 이용자에게 주민등록증(모바일 주민등록증을 포함한다) 또는 그 밖의 연령을 확인할 수 있는 증표의 제시를 요구할 수 있으며, 정당한 사유 없이 증표를 제시하지 아니하는 사람에게는 게임장 출입을 제한할 수 있다."]],"game:29":[[0,"제29조(영업의 승계)"],[1,"①제25조 또는 제26조에 따라 허가를 받은 영업자 또는 등록ㆍ신고를 한 영업자가 그 영업을 양도하거나 사망한 때 또는 그 법인의 합병이 있는 때에는 그 양수인ㆍ상속인 또는 합병 후 존속하는 법인이나 합병에 의하여 설립되는 법인은 그 영업자의 지위를 승계한다."],[1,"②제30조에 따른 폐업신고에 의하여 허가가 취소되거나 등록 또는 신고가 말소된 자가 1년 이내에 폐업한 장소에서 같은 업종으로 다시 허가를 받거나 등록 또는 신고를 하고자 하는 경우에는 해당 영업자는 폐업신고 전의 영업자의 지위를 승계한다."],[1,"③「민사집행법」에 의한 경매, 「채무자 회생 및 파산에 관한 법률」에 의한 환가나 「국세징수법」ㆍ「관세법」 또는 「지방세징수법」에 의한 압류재산의 매각 그 밖에 이에 준하는 절차에 따라 영업자의 시설ㆍ기구(대통령령으로 정하는 주요시설 및 기구를 말한다)의 전부를 인수한 자는 그 영업자의 지위를 승계한다."],[1,"④제1항부터 제3항까지에 따라 영업자의 지위를 승계받은 자는 관할 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장에게 신고하여야 한다."],[1,"⑤ 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장은 제4항에 따른 신고를 받은 날부터 15일 이내에 신고수리 여부를 신고인에게 통지하여야 한다."],[1,"⑥ 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장이 제5항에서 정한 기간 내에 신고수리 여부 또는 민원 처리 관련 법령에 따른 처리기간의 연장을 신고인에게 통지하지 아니하면 그 기간(민원 처리 관련 법령에 따라 처리기간이 연장 또는 재연장된 경우에는 해당 처리기간을 말한다)이 끝난 날의 다음 날에 신고를 수리한 것으로 본다."]],"game:31":[[0,"제31조(사후관리)"],[1,"①문화체육관광부장관은 게임물의 공정한 등급분류, 유통 및 이용제공의 건전한 영업질서 확립을 위하여 위원회의 게임물 유통과 관련된 사후관리 업무, 등급분류기관 및 게임물 관련사업자에 대하여 이 법의 준수 여부에 관한 사항을 문화체육관광부령으로 정하는 바에 따라 주기적으로 조사하고 관리하여야 한다."],[1,"② 문화체육관광부장관, 특별시장ㆍ광역시장ㆍ특별자치시장ㆍ도지사ㆍ특별자치도지사(이하 \"시ㆍ도지사\"라 한다) 또는 시장ㆍ군수ㆍ구청장은 다음 각 호의 목적을 위하여 필요하다고 인정되는 때에는 게임물 관련사업자에 대하여 필요한 보고를 하게 하거나 관계 공무원으로 하여금 게임제공업 또는 인터넷컴퓨터게임시설제공업의 영업소 등에 출입하여 필요한 조사를 하게 하거나 서류를 열람하게 할 수 있다."],[2,"1. 게임물의 유통질서 확립"],[2,"2. 게임물의 사행행위에의 이용 방지"],[2,"3. 게임물의 사행성 조장 방지"],[1,"③시ㆍ도지사 및 시장ㆍ군수ㆍ구청장은 대통령령으로 정하는 바에 따라 게임물 관련사업자 실태보고서를 문화체육관광부장관, 행정안전부장관, 경찰청장 및 대통령령에서 정하는 관계 행정기관의 장에게 주기적으로 제출하여야 한다."],[1,"④제2항의 규정에 따라 출입ㆍ검사를 하는 관계공무원은 그 권한을 표시하는 증표를 지니고 이를 관계인에게 내보여야 한다."]],"game:32":[[0,"제32조(불법게임물 등의 유통금지 등)"],[1,"①누구든지 게임물의 유통질서를 저해하는 다음 각 호의 행위를 하여서는 아니 된다. 다만, 제4호의 경우 「사행행위 등 규제 및 처벌특례법」에 따라 사행행위영업을 하는 자는 제외한다."],[2,"1. 제21조제1항 또는 제21조의10제1항에 따라 등급을 받지 아니한 게임물을 유통 또는 이용에 제공하거나 이를 위하여 진열ㆍ보관하는 행위"],[2,"2. 제21조제1항 또는 제21조의10제1항에 따라 등급을 받은 내용과 다른 내용의 게임물을 유통 또는 이용에 제공하거나 이를 위하여 진열ㆍ보관하는 행위"],[2,"3. 등급을 받은 게임물을 제21조제2항 각 호의 등급구분을 위반하여 이용에 제공하는 행위"],[2,"4. 제22조제2항의 규정에 따라 사행성게임물에 해당되어 등급분류가 거부된 게임물을 유통시키거나 이용에 제공하는 행위 또는 유통ㆍ이용제공의 목적으로 진열ㆍ보관하는 행위"],[2,"5. 제22조제3항제1호에 따른 등급분류증명서를 매매ㆍ증여 또는 대여하는 행위"],[2,"6. 제33조제1항 또는 제3항을 위반하여 등급 및 게임물내용정보 등의 표시사항을 표시하지 아니한 게임물 또는 게임물의 운영에 관한 정보를 표시하는 장치를 부착하지 아니한 게임물을 유통시키거나 이용에 제공하는 행위"],[2,"7. 누구든지 게임물의 이용을 통하여 획득한 유ㆍ무형의 결과물(점수, 경품, 게임 내에서 사용되는 가상의 화폐로서 대통령령으로 정하는 게임머니 및 대통령령으로 정하는 이와 유사한 것을 말한다)을 환전 또는 환전 알선하거나 재매입을 업으로 하는 행위"],[2,"8. 게임물의 정상적인 운영을 방해할 목적으로 게임물 관련사업자가 제공 또는 승인하지 아니한 컴퓨터프로그램이나 기기 또는 장치를 배포하거나 배포할 목적으로 제작하는 행위"],[2,"9. 게임물 관련사업자가 제공 또는 승인하지 아니한 게임물을 제작, 배급, 제공 또는 알선하는 행위"],[2,"10. 제9호에 따른 불법행위를 할 목적으로 컴퓨터프로그램이나 기기 또는 장치를 제작 또는 유통하는 행위"],[2,"11. 게임물 관련사업자가 승인하지 아니한 방법으로 게임물의 점수ㆍ성과 등을 대신 획득하여 주는 용역의 알선 또는 제공을 업으로 함으로써 게임물의 정상적인 운영을 방해하는 행위"],[1,"②누구든지 다음 각 호에 해당하는 게임물을 제작 또는 반입하여서는 아니 된다."],[2,"1. 반국가적인 행동을 묘사하거나 역사적 사실을 왜곡함으로써 국가의 정체성을 현저히 손상시킬 우려가 있는 것"],[2,"2. 존비속에 대한 폭행ㆍ살인 등 가족윤리의 훼손 등으로 미풍양속을 해칠 우려가 있는 것"],[2,"3. 범죄ㆍ폭력ㆍ음란 등을 지나치게 묘사하여 범죄심리 또는 모방심리를 부추기는 등 사회질서를 문란하게 할 우려가 있는 것"]],"game:33":[[0,"제33조(표시의무)"],[1,"①게임물을 유통시키거나 이용에 제공할 목적으로 게임물을 제작 또는 배급하는 자는 해당 게임물마다 제작 또는 배급하는 자의 상호(도서에 부수되는 게임물의 경우에는 출판사의 상호를 말한다), 등급 및 게임물내용정보를 표시하여야 한다."],[1,"② 게임물을 유통시키거나 이용에 제공할 목적으로 게임물을 제작, 배급 또는 제공하는 자는 해당 게임물과 그 인터넷 홈페이지 및 광고ㆍ선전물마다 해당 게임물 내에서 사용되는 확률형 아이템의 종류와 종류별 공급 확률정보 및 그 밖에 대통령령으로 정하는 사항을 표시하여야 한다."],[1,"③게임물을 유통시키거나 이용에 제공할 목적으로 게임물을 제작 또는 배급하는 자는 대통령령으로 정하는 게임물에 대하여 게임물의 운영에 관한 정보를 표시하는 장치를 부착하여야 한다."],[1,"④제1항부터 제3항까지에 따른 표시의무 대상 게임물의 범위 및 표시의 방법 등에 관하여 필요한 사항은 대통령령으로 정한다."]],"game:34":[[0,"제34조(광고ㆍ선전의 제한)"],[1,"①누구든지 다음 각 호의 행위를 하여서는 아니된다."],[2,"1. 등급을 받은 게임물의 내용과 다른 내용의 광고를 하거나 그 선전물을 배포ㆍ게시하는 행위"],[2,"2. 등급분류를 받은 게임물의 등급과 다른 등급을 표시한 광고ㆍ선전물을 배포ㆍ게시하는 행위"],[2,"3. 게임물내용정보를 다르게 표시하여 광고하거나 그 선전물을 배포ㆍ게시하는 행위"],[2,"4. 게임물에 대하여 내용정보 외에 경품제공 등 사행심을 조장하는 내용을 광고하거나 선전물을 배포ㆍ게시하는 행위"],[1,"②게임제공업, 인터넷컴퓨터게임시설제공업 또는 복합유통게임제공업을 하는 자는 사행행위와 도박이 이루어지는 장소로 오인할 수 있는 광고물로서 대통령령으로 정하는 광고물을 설치 또는 게시하여서는 아니 된다."]],"game:35":[[0,"제35조(허가취소 등)"],[1,"①특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장은 제25조제1항에 따라 게임제작업 또는 게임배급업의 등록을 한 자가 다음 각 호의 어느 하나에 해당하는 때에는 6월 이내의 기간을 정하여 영업정지를 명하거나 영업폐쇄를 명할 수 있다. 다만, 제1호 또는 제2호에 해당하는 때에는 영업폐쇄를 명하여야 한다."],[2,"1. 거짓이나 그 밖의 부정한 방법으로 등록한 때"],[2,"2. 영업정지명령을 위반하여 영업을 계속한 때"],[2,"3. 제25조제2항의 규정을 위반하여 변경등록을 하지 아니한 때"],[2,"4. 제28조에 따른 준수사항을 위반한 때"],[2,"5. 제32조에 따른 불법게임물 등의 유통금지의무 등을 위반한 때"],[1,"②특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장은 제26조에 따라 게임제공업ㆍ인터넷컴퓨터게임시설제공업 또는 복합유통게임제공업의 허가를 받거나 등록 또는 신고를 한 자(제26조제2항에 따라 정보통신망을 통한 게임제공업 등록을 한 자는 제외한다)가 다음 각 호의 어느 하나에 해당하는 때에는 6월 이내의 기간을 정하여 영업정지를 명하거나 허가ㆍ등록취소 또는 영업폐쇄를 명할 수 있다. 다만, 제1호 또는 제2호에 해당하는 때에는 허가ㆍ등록취소 또는 영업폐쇄를 명하여야 하고, 제5호 중 제28조제1항제5호, 제5호의2 또는 제7호에 따른 준수사항을 위반하여 제1항제4호에 해당하는 경우로서 청소년의 신분증 위조ㆍ변조 또는 도용으로 청소년의 연령을 알지 못하였거나 폭행 또는 협박으로 연령을 확인하지 못한 사정이 인정되는 때에는 문화체육관광부령으로 정하는 바에 따라 해당 행정처분을 면제할 수 있다."],[2,"1. 거짓이나 그 밖의 부정한 방법으로 허가를 받거나 등록 또는 신고를 한 때"],[2,"2. 영업정지명령을 위반하여 영업을 계속한 때"],[2,"3. 제26조제1항부터 제3항까지에 따른 허가ㆍ등록기준을 갖추지 아니한 때"],[2,"4. 제26조제4항에 따른 변경허가를 받지 아니하거나 변경등록ㆍ변경신고를 하지 아니한 때"],[2,"5. 제1항제4호 및 제5호에 해당한 때"],[1,"③ 특별자치시장ㆍ특별자치도 한다."],[1,"④ 삭제"],[1,"⑤ 삭제"]],"gdec:2":[[0,"제2조(게임제공업 등에서 제외되는 게임물제공의 범위)"],[1,"① 법 제2조제6호 다목에서 \"대통령령이 정하는 종류 및 방법 등에 의하여 게임물을 제공하는 경우\"란 다음 각 호에서 정하는 기준을 모두 충족하여 게임물을 제공하는 경우를 말한다."],[2,"1. 전체이용가 게임물만을 제공할 것"],[2,"2. 1개의 영업소당 문화체육관광부장관이 정하여 고시하는 수 이하의 게임물을 설치할 것"],[2,"3. 게임물을 당해 영업소 건물 내에 설치할 것"],[1,"② 법 제2조제7호 단서에서 \"대통령령으로 정하는 종류 및 방법 등에 따라 게임물을 제공하는 경우\"란 다음 각 호에서 정하는 기준을 모두 충족하여 게임물을 제공하는 경우를 말한다."],[2,"1. 전체이용가 게임물만을 제공할 것"],[2,"2. 1개의 영업소당 게임물을 이용할 수 있는 컴퓨터 등 필요한 기자재를 문화체육관광부장관이 정하여 고시하는 수 이하로 설치할 것"],[2,"3. 컴퓨터 등 필요한 기자재를 해당 영업소 건물 내에 설치할 것"]],"gdec:16":[[0,"제16조(영업시간 및 청소년 출입시간제한 등) 법 제28조제1항제7호에 따른 영업시간 및 청소년의 출입시간은 다음 각 호와 같다."],[2,"1. 영업시간"],[3,"가. 일반게임제공업자의 영업시간은 오전 9시부터 오후 12시까지로 한다."],[3,"나. 복합유통게임제공업자의 영업시간은 오전 9시부터 오후 12시까지로 한다. 다만, 다음의 경우에는 영업시간의 제한을 받지 아니한다."],[3,"1) 다목 단서에 따라 영업시간의 제한을 받지 아니하는 청소년게임제공업과 이 법에 따른 다른 영업 또는 다른 법률에 따른 영업을 동일한 장소에서 함께 영위하는 복합유통게임제공업자"],[3,"2) 라목에 따라 영업시간의 제한을 받지 아니하는 인터넷컴퓨터게임시설제공업과 이 법에 따른 다른 영업 또는 다른 법률에 따른 영업을 동일한 장소에서 함께 영위하는 복합유통게임제공업자"],[3,"다. 청소년게임제공업자의 영업시간은 오전 9시부터 오후 12시까지로 한다. 다만, 청소년게임제공업자 중 게임 이용에 따라 획득된 결과물(법 제28조제1항제3호 단서에 따라 제공하는 경품을 포함한다)의 제공이 가능한 전체이용가 게임물의 대수 및 설치면적이 전체 대수 및 설치면적의 100분의 20을 초과하지 않는 경우에는 영업시간의 제한을 받지 아니한다."],[3,"라. 가목, 나목 본문 및 다목 본문 외의 게임물 관련사업자는 영업시간의 제한을 받지 아니한다."],[2,"2. 청소년의 출입시간"],[3,"가. 청소년게임제공업자, 복합유통게임제공업자(「청소년 보호법 시행령」 제5조제1항제2호 단서에 따라 청소년의 출입이 허용되는 경우만 해당한다), 인터넷컴퓨터게임시설제공업자의 청소년 출입시간은 오전 9시부터 오후 10시까지로 한다. 다만, 청소년이 친권자ㆍ후견인ㆍ교사 또는 직장의 감독자 그 밖에 당해 청소년을 보호ㆍ감독할 만한 실질적인 지위에 있는 자를 동반한 경우에는 청소년 출입시간 외의 시간에도 청소년을 출입시킬 수 있다."],[3,"나. 가목 외의 게임물 관련사업자는 청소년 출입시간의 적용을 받지 아니한다."]],"gdec:16-2":[[0,"제16조의2(경품의 종류 등) 법 제28조제1항제3호 단서에 따라 제공할 수 있는 경품의 종류와 그 지급기준 및 방법은 다음과 같다."],[2,"1. 경품의 종류"],[3,"가. 완구류 및 문구류"],[3,"나. 문화상품류, 스포츠용품류 및 생활용품류. 다만, 다음의 어느 하나에 해당하는 물품은 제외한다."],[3,"1) 음식물 등 사용기한, 소비기한 또는 유통기한이 있는 물품"],[3,"2) 선정성ㆍ사행성ㆍ폭력성을 유발할 수 있는 물품"],[3,"3) 심신에 해를 가할 수 있는 물품"],[3,"4) 「청소년 보호법」 제2조에 따른 청소년유해매체물, 청소년유해약물 및 청소년유해물건"],[2,"2. 경품의 지급기준\n 지급되는 경품은 소비자판매가격(일반 소매상점에서의 판매가격을 말한다) 1만원 이내의 것으로 한다"],[2,"3. 경품의 제공방법\n 등급분류 시 심의된 게임물의 경품지급장치를 통해서만 제공하여야 하며, 영업소관계자 등이 경품을 직접 제공하여서는 아니된다."]],"gdec:17":[[0,"제17조(게임물 관련사업자의 준수사항) 법 제28조제1항제8호에서 \"대통령령이 정하는 사항\"이라 함은 별표 2와 같다."]],"gdec:18-4":[[0,"제18조의4(게임머니 등) 법 제32조제1항제7호에서 \"대통령령이 정하는 게임머니 및 대통령령이 정하는 이와 유사한 것\"이란 다음 각 호의 어느 하나에 해당하는 것을 말한다."],[2,"1. 게임물을 이용할 때 베팅 또는 배당의 수단이 되거나 우연적인 방법으로 획득된 게임머니"],[2,"2. 제1호에서 정하는 게임머니의 대체 교환 대상이 된 게임머니 또는 게임아이템(게임의 진행을 위하여 게임 내에서 사용되는 도구를 말한다. 이하 같다) 등의 데이터"],[2,"3. 다음 각 목의 어느 하나에 해당하는 게임머니 또는 게임아이템 등의 데이터"],[3,"가. 게임제작업자의 컴퓨터프로그램을 복제, 개작, 해킹 등을 하여 생산ㆍ획득한 게임머니 또는 게임아이템 등의 데이터"],[3,"나. 법 제32조제1항제8호에 따른 컴퓨터프로그램이나 기기 또는 장치를 이용하여 생산ㆍ획득한 게임머니 또는 게임아이템 등의 데이터"],[3,"다. 다른 사람의 개인정보로 게임물을 이용하여 생산ㆍ획득한 게임머니 또는 게임아이템 등의 데이터"],[3,"라. 게임물을 이용하여 업으로 게임머니 또는 게임아이템 등을 생산ㆍ획득하는 등 게임물의 비정상적인 이용을 통하여 생산ㆍ획득한 게임머니 또는 게임아이템 등의 데이터"]],"gdec:별표2":[[0,"게임물 관련사업자 준수사항(제17조 관련)"],[2,"1. 게임물 관련사업자는 허가증, 신고증 또는 등록증을 출입자가 쉽게 볼 수 있는 곳에 붙여야 한다."],[2,"2. 일반게임제공업자, 청소년게임제공업자(법 제28조제3호 단서에 따라 경품을제공하는 경우에만 해당한다)는 영업장 안에서 1명이 동시에 2대 이상의 게임물 등을 이용할 수 없도록 관리하여야 한다."],[2,"3. 일반게임제공업자·청소년게임제공업자·인터넷컴퓨터게임시설제공업자 및복합유통게임제공업자는 출입자가 보기 쉬운 곳에 다음 각 호의 내용을 포함하는 가로 50센티미터, 세로 50센티미터 이상의 안내문을 게시하여야 한다."],[3,"가. 청소년 출입여부 및 출입가능시간"],[3,"나. 음란물의 이용·제공 금지"],[3,"다. 도박·사행행위의 금지"],[3,"라. 경품취급기준의 준수"],[3,"마. 영업시간"],[2,"4. 복합유통게임제공업자는 다음 각 목의 사항을 준수하여야 한다."],[3,"가. 영업소에 주류를 보관하거나 이용자의 주류 반입을 허용하거나 묵인해서는 안 된다."],[3,"나. 남녀 접대부를 고용·알선하는 행위를 해서는 안 된다."],[2,"5. 인터넷컴퓨터게임시설제공업자는 다음 각 목의 사항을 준수하여야 한다."],[3,"가. 개별 컴퓨터별로 밀실이나 밀폐된 공간을 설치하여서는 아니 된다. 다만,흡연실의 경우에는 그러하지 아니하다."],[3,"나. 개별 컴퓨터별로 바닥으로부터 높이 1.3미터를 초과하는 칸막이를 설치하여서는 아니 된다. 다만, 머리에 쓰는 영상표시기기(Head MountedDisplay) 등을 이용하는 게임물로서 몸동작을 수반할 수 있는 게임물을 이용하는 사람의 안전사고 예방을 위하여 내부가 잘 보이는 재질의 창 등을설치하는 경우에는 높이 1.3미터를 초과하여 칸막이를 설치할 수 있다."],[3,"다. 삭제 <2015.1.6.>"],[3,"라. 삭제 <2024. 1. 9.>"],[2,"6. 청소년게임제공업자는 법 제28조제3호 단서에 따라 경품을 제공하려는 경우에는 다음 각 목의 사항을 준수하여야 한다."],[3,"가. 경품을 환전, 환전 알선, 재매입하거나 다른 물품으로 교환하여 주어서는아니 된다."],[3,"나. 경품 외의 다른 물품을 전시·보관하여 경품으로 오인하게 하여서는 아니된다."],[2,"7. 일반게임제공업자·청소년게임제공업자 및 복합유통게임제공업자는 게임물의이용을 통하여 획득한 결과물(점수 및 이와 유사한 것을 말한다)이 환전되도록 장부에 표시하여 관리하거나 그 결과물이 표시된 증표를 내주어서는 안 된"],[3,"다."],[2,"8. 정보통신망을 통하여 베팅이나 배당의 내용을 모사한 카드게임, 화투놀이 또는 스포츠 승부예측 게임 등의 게임물(이하 이 호에서 \"게임물\"이라 한다)을제공하는 게임제공업자는 다음 각 목의 사항을 준수하여야 한다."],[3,"가. 게임물 이용자 1명이 게임물을 이용하기 위한 가상현금(캐쉬 등을 말한"],[3,"다. 이하 이 호에서 같다), 게임아이템 등의 1개월간 구매(다른 게임물 이용자로부터 증여 등을 통하여 받는 것을 포함한다)한도가 100만원을 초과할 수 없도록 하여야 한다."],[3,"나. 게임물 이용자 1명이 1회 게임에 사용할 수 있는 게임머니가 가목에 따른구매한도 규모에 따라 지급될 수 있는 게임머니(게임물 이용자 1명이 가목의 한도까지 가상현금, 게임아이템 등을 구매하는 때 지급될 수 있는 게임머니 총량의 최저치를 기준으로 한다. 이하 이 호에서 같다)의 10분의 1을초과할 수 없도록 하여야 한다."],[3,"다. 삭제 <2020. 4. 7.>"],[3,"라. 게임물 이용자가 게임(주된 게임 외에 게임의 특성에 따라 부가적으로 제공되는 서비스를 포함한다) 이용의 상대방을 선택할 수 없도록 해야 한다.다만, 다음의 어느 하나에 해당하는 경우에는 그렇지 않다."],[3,"1) 무료로 제공하는 별도의 게임머니만을 사용하는 경우"],[3,"2) 게임물 이용자 1명이 1회 게임에서 사용할 수 있는 게임머니가 가목의구매한도 규모에 따라 지급될 수 있는 게임머니의 200분의 1을 초과하지않는 경우"],[3,"마. 게임물 이용자가 게임을 이용할 경우 베팅을 자동으로 할 수 없도록 하여야 한다."],[3,"바. 「전자서명법」 제2조제8호에 따른 전자서명인증사업자, 그 밖에 본인확인서비스를 제공하는 제3자 또는 행정기관에 의뢰하거나 대면확인 등을 통하여 게임물 이용자가 본인임을 확인할 수 있는 수단을 마련하고, 1년마다게임물 이용자에 대하여 본인 확인을 하여야 한다."],[3,"사. 게임제공업자는 게임물 이용자 보호 및 게임물의 사행화 방지 방안을 위원회와 협의하여 수립해야 한다."],[2,"9. 일반게임제공업자, 청소년게임제공업자, 인터넷컴퓨터게임시설제공업자 및 복합유통게임제공업자는 게임물의 버튼 등 입력장치를 자동으로 조작하여 게임을 진행하는 장치 또는 소프트웨어를 제공하거나 게임물 이용자가 이를 이용하게 해서는 안 된다."]],"crim:246":[[0,"제246조(도박, 상습도박)"],[1,"① 도박을 한 사람은 1천만원 이하의 벌금에 처한다. 다만, 일시오락 정도에 불과한 경우에는 예외로 한다."],[1,"② 상습으로 제1항의 죄를 범한 사람은 3년 이하의 징역 또는 2천만원 이하의 벌금에 처한다."]],"crim:247":[[0,"제247조(도박장소 등 개설) 영리의 목적으로 도박을 하는 장소나 공간을 개설한 사람은 5년 이하의 징역 또는 3천만원 이하의 벌금에 처한다."]],"crim:248":[[0,"제248조(복표의 발매 등)"],[1,"① 법령에 의하지 아니한 복표를 발매한 사람은 5년 이하의 징역 또는 3천만원 이하의 벌금에 처한다."],[1,"② 제1항의 복표발매를 중개한 사람은 3년 이하의 징역 또는 2천만원 이하의 벌금에 처한다."],[1,"③ 제1항의 복표를 취득한 사람은 1천만원 이하의 벌금에 처한다."]],"crim:260":[[0,"제260조(폭행, 존속폭행)"],[1,"①사람의 신체에 대하여 폭행을 가한 자는 2년 이하의 징역, 500만원 이하의 벌금, 구류 또는 과료에 처한다."],[1,"②자기 또는 배우자의 직계존속에 대하여 제1항의 죄를 범한 때에는 5년 이하의 징역 또는 700만원 이하의 벌금에 처한다."],[1,"③제1항 및 제2항의 죄는 피해자의 명시한 의사에 반하여 공소를 제기할 수 없다."]],"crim:314":[[0,"제314조(업무방해)"],[1,"①제313조의 방법 또는 위력으로써 사람의 업무를 방해한 자는 5년 이하의 징역 또는 1천500만원 이하의 벌금에 처한다."],[1,"②컴퓨터등 정보처리장치 또는 전자기록등 특수매체기록을 손괴하거나 정보처리장치에 허위의 정보 또는 부정한 명령을 입력하거나 기타 방법으로 정보처리에 장애를 발생하게 하여 사람의 업무를 방해한 자도 제1항의 형과 같다."]],"crim:319":[[0,"제319조(주거침입, 퇴거불응)"],[1,"①사람의 주거, 관리하는 건조물, 선박이나 항공기 또는 점유하는 방실에 침입한 자는 3년 이하의 징역 또는 500만원 이하의 벌금에 처한다."],[1,"②전항의 장소에서 퇴거요구를 받고 응하지 아니한 자도 전항의 형과 같다."]],"crim:329":[[0,"제329조(절도) 타인의 재물을 절취한 자는 6년 이하의 징역 또는 1천만원 이하의 벌금에 처한다."]],"crim:347":[[0,"제347조(사기)"],[1,"① 사람을 기망하여 재물의 교부를 받거나 재산상의 이익을 취득한 자는 20년 이하의 징역 또는 5천만원 이하의 벌금에 처한다."],[1,"②전항의 방법으로 제삼자로 하여금 재물의 교부를 받게 하거나 재산상의 이익을 취득하게 한 때에도 전항의 형과 같다."]],"crim:366":[[0,"제366조(재물손괴등) 타인의 재물, 문서 또는 전자기록등 특수매체기록을 손괴 또는 은닉 기타 방법으로 기 효용을 해한 자는 3년이하의 징역 또는 700만원 이하의 벌금에 처한다."]],"proc:211":[[0,"제211조(현행범인과 준현행범인)"],[1,"① 범죄를 실행하고 있거나 실행하고 난 직후의 사람을 현행범인이라 한다."],[1,"② 다음 각 호의 어느 하나에 해당하는 사람은 현행범인으로 본다."],[2,"1. 범인으로 불리며 추적되고 있을 때"],[2,"2. 장물이나 범죄에 사용되었다고 인정하기에 충분한 흉기나 그 밖의 물건을 소지하고 있을 때"],[2,"3. 신체나 의복류에 증거가 될 만한 뚜렷한 흔적이 있을 때"],[2,"4. 누구냐고 묻자 도망하려고 할 때"]],"proc:212":[[0,"제212조(현행범인의 체포) 현행범인은 누구든지 영장없이 체포할 수 있다."]],"proc:214":[[0,"제214조(경미사건과 현행범인의 체포) 다액 50만원이하의 벌금, 구류 또는 과료에 해당하는 죄의 현행범인에 대하여는 범인의 주거가 분명하지 아니한 때에 한하여 제212조 내지 제213조의 규정을 적용한다."]],"proc:216":[[0,"제216조(영장에 의하지 아니한 강제처분)"],[1,"①사법경찰관은 제200조의2ㆍ제200조의3ㆍ제201조 또는 제212조에 따라 피의자를 체포 또는 구속하는 경우에 필요한 때에는 영장없이 다음 각 호의 처분을 할 수 있다."],[2,"1. 타인의 주거나 타인이 간수하는 가옥, 건조물, 항공기, 선박, 차량 내에서의 피의자 수색. 다만, 제200조의2 또는 제201조에 따라 피의자를 체포 또는 구속하는 경우의 피의자 수색은 미리 수색영장을 발부받기 어려운 긴급한 사정이 있는 때에 한정한다."],[2,"2. 체포현장에서의 압수, 수색, 검증"],[1,"② 제1항제2호는 사법경찰관이 피고인에 대한 구속영장을 집행하는 경우에 준용한다."],[1,"③범행 중 또는 범행직후의 범죄 장소에서 긴급을 요하여 법원판사의 영장을 받을 수 없는 때에는 영장없이 압수, 수색 또는 검증을 할 수 있다. 이 경우에는 사후에 지체없이 영장을 받아야 한다."]],"proc:217":[[0,"제217조(영장에 의하지 아니하는 강제처분)"],[1,"①사법경찰관은 제200조의3에 따라 체포된 자가 소유ㆍ소지 또는 보관하는 물건에 대하여 긴급히 압수할 필요가 있는 경우에는 체포한 때부터 24시간 이내에 한하여 영장 없이 압수ㆍ수색 또는 검증을 할 수 있다."],[1,"②사법경찰관은 제1항 또는 제216조제1항제2호에 따라 압수한 물건을 계속 압수할 필요가 있는 경우에는 지체 없이 압수ㆍ수색영장을 검사에게 신청하여 검사의 청구로 관할 지방법원 판사의 압수ㆍ수색영장을 발부받아야 한다. 이 경우 검사의 압수ㆍ수색영장의 청구는 체포한 때부터 48시간 이내에 하여야 한다."],[1,"③사법경찰관은 제2항에 따라 검사가 청구한 압수수색영장을 발부받지 못한 때에는 압수한 물건을 즉시 반환하여야 한다."]],"proc:218":[[0,"제218조(영장에 의하지 아니한 압수) 사법경찰관은 피의자 또는 그 밖의 사람이 유류한 물건이나 소유자, 소지자 또는 보관자가 임의로 제출한 물건을 영장없이 압수할 수 있다."]],"sah:2":[[0,"제2조(정의)"],[1,"① 이 법에서 사용하는 용어의 뜻은 다음과 같다."],[2,"1. \"사행행위\"란 여러 사람으로부터 재물이나 재산상의 이익(이하 \"재물등\"이라 한다)을 모아 우연적(偶然的) 방법으로 득실(得失)을 결정하여 재산상의 이익이나 손실을 주는 행위를 말한다."],[2,"2. \"사행행위영업\"이란 다음 각 목의 어느 하나에 해당하는 영업을 말한다."],[3,"가. 복권발행업(福券發行業): 특정한 표찰(컴퓨터프로그램 등 정보처리능력을 가진 장치에 의한 전자적 형태를 포함한다)을 이용하여 여러 사람으로부터 재물등을 모아 추첨 등의 방법으로 당첨자에게 재산상의 이익을 주고 다른 참가자에게 손실을 주는 행위를 하는 영업"],[3,"나. 현상업(懸賞業): 특정한 설문 또는 예측에 대하여 그 답을 제시하거나 예측이 적중하면 이익을 준다는 조건으로 응모자로부터 재물등을 모아 그 정답자나 적중자의 전부 또는 일부에게 재산상의 이익을 주고 다른 참가자에게 손실을 주는 행위를 하는 영업"],[3,"다. 그 밖의 사행행위업: 가목 및 나목 외에 영리를 목적으로 회전판돌리기, 추첨, 경품(景品) 등 사행심을 유발할 우려가 있는 기구 또는 방법 등을 이용하는 영업으로서 대통령령으로 정하는 영업"],[2,"3. \"사행기구 제조업\"이란 사행행위영업에 이용되는 기계, 기판(機板), 용구(用具) 또는 컴퓨터프로그램(이하 \"사행기구\"라 한다)을 제작ㆍ개조하거나 수리하는 영업을 말한다."],[2,"4. \"사행기구 판매업\"이란 사행기구를 판매하거나 수입(輸入)하는 영업을 말한다."],[2,"5. \"투전기\"란 동전ㆍ지폐 또는 그 대용품(代用品)을 넣으면 우연의 결과에 따라 재물등이 배출되어 이용자에게 재산상 이익이나 손실을 주는 기기를 말한다."],[2,"6. \"사행성 유기기구\"란 제5호의 투전기 외에 기계식 구슬치기 기구와 사행성 전자식 유기기구 등 사행심을 유발할 우려가 있는 기계ㆍ기구 등을 말한다."],[1,"② 제1항제2호부터 제4호까지의 영업은 대통령령으로 정하는 바에 따라 세분할 수 있다."]],"sah:4":[[0,"제4조(허가 등)"],[1,"① 사행행위영업을 하려는 자는 제3조에 따른 시설 등을 갖추어 행정안전부령으로 정하는 바에 따라 시ㆍ도경찰청장의 허가를 받아야 한다. 다만, 그 영업의 대상 범위가 둘 이상의 특별시ㆍ광역시ㆍ도 또는 특별자치도에 걸치는 경우에는 경찰청장의 허가를 받아야 한다."],[1,"② 제1항에 따른 허가를 받은 자가 대통령령으로 정하는 중요 사항을 변경하려면 행정안전부령으로 정하는 바에 따라 경찰청장이나 시ㆍ도경찰청장의 허가를 받아야 한다."],[1,"③ 국가기관이나 지방자치단체가 사행행위영업을 하려면 경찰청장의 승인을 받아야 한다."]],"sah:30":[[0,"제30조(벌칙)"],[1,"① 다음 각 호의 어느 하나에 해당하는 자는 5년 이하의 징역 또는 5천만원 이하의 벌금에 처한다."],[2,"1. 사행행위영업 외에 투전기나 사행성 유기기구를 이용하여 사행행위를 업(業)으로 한 자"],[2,"2. 제1호의 행위를 업으로 하는 자에게 투전기나 사행성 유기기구를 판매하거나 판매할 목적으로 제조 또는 수입한 자"],[1,"② 다음 각 호의 어느 하나에 해당하는 자는 3년 이하의 징역 또는 2천만원 이하의 벌금에 처한다."],[2,"1. 제4조제1항 또는 제7조제2항에 따른 허가를 받지 아니하고 영업을 한 자"],[2,"2. 제12조제2호 또는 제3호를 위반하여 사행기구를 설치ㆍ사용하거나 변조한 자"],[2,"3. 제13조제1항 또는 제2항에 따른 허가를 받지 아니하고 영업을 한 자"],[1,"③ 다음 각 호의 어느 하나에 해당하는 자는 1년 이하의 징역 또는 1천만원 이하의 벌금에 처한다."],[2,"1. 제4조제2항 또는 제13조제3항에 따른 변경허가를 받지 아니하고 영업을 한 자"],[2,"2. 제9조제3항(제13조제4항에 따라 준용되는 경우를 포함한다)을 위반하여 승계신고를 하지 아니하고 영업을 한 자"],[2,"3. 제12조 각 호 외의 부분을 위반하여 제11조에 따른 영업의 방법 및 당첨금에 관하여 대통령령으로 정하는 사항이나 영업시간 등의 제한을 지키지 아니하고 영업을 한 자"],[2,"4. 제12조제1호를 위반하여 영업명의를 다른 사람에게 빌려준 자"],[2,"5. 제12조제4호를 위반하여 청소년을 입장시키거나 청소년의 참가를 허용하여 영업을 한 자"],[2,"6. 제12조제5호를 위반하여 광고나 선전을 한 자"],[2,"7. 제12조의2에 따른 검사를 받지 아니한 사행기구를 이용하여 영업을 한 자"],[2,"8. 제15조제1항에 따른 검사를 받지 아니한 사행기구를 판매한 자"],[2,"9. 제15조제2항(제12조의2제2항에 따라 준용되는 경우를 포함한다)에 따른 검사합격증명서를 훼손하거나 제거한 자"],[2,"10. 제15조제3항을 위반하여 검사기록을 보존하지 아니한 자"],[2,"11. 제16조를 위반하여 표시 없는 사행기구를 판매하거나 거짓으로 표시하여 판매한 자"],[2,"12. 제18조제1항에 따른 보고를 하지 아니하거나 거짓으로 보고한 자 및 관계 공무원의 출입ㆍ검사나 그 밖의 조치를 거부ㆍ방해 또는 기피한 자"],[2,"13. 제19조제2항에 따른 개수(改修)ㆍ개선 또는 시정 명령에 따르지 아니한 자"],[2,"14. 제21조제2항에 따른 영업정지처분을 위반하여 영업정지기간 중에 영업을 한 자"]],"spo:26":[[0,"제26조(유사행위의 금지 등)"],[1,"① 서울올림픽기념국민체육진흥공단과 수탁사업자가 아닌 자는 체육진흥투표권 또는 이와 비슷한 것을 발행(정보통신망에 의한 발행을 포함한다)하여 결과를 적중시킨 자에게 재물이나 재산상의 이익을 제공하는 행위(이하 \"유사행위\"라 한다)를 하여서는 아니 된다."],[1,"② 누구든지 다음 각 호의 어느 하나에 해당하는 행위를 하여서는 아니 된다."],[2,"1. 「정보통신망 이용촉진 및 정보보호 등에 관한 법률」 제2조제1항제1호에 따른 정보통신망을 이용하여 체육진흥투표권이나 이와 비슷한 것을 발행하는 시스템을 설계ㆍ제작ㆍ유통 또는 공중이 이용할 수 있도록 제공하는 행위"],[2,"2. 유사행위를 위하여 해당 운동경기 관련 정보를 제공하는 행위"],[2,"3. 유사행위를 홍보하거나 체육진흥투표권 또는 이와 비슷한 것의 구매를 중개 또는 알선하는 행위"],[1,"③ 삭제"],[1,"④ 삭제"]],"spo:47":[[0,"제47조(벌칙) 다음 각 호의 어느 하나에 해당하는 자는 7년 이하의 징역이나 7천만원 이하의 벌금에 처한다."],[2,"1. 제14조의3제1항을 위반하여 부정한 행위를 한 전문체육선수등(「초ㆍ중등교육법」 제2조에 따른 학교의 학생선수는 제외한다)"],[2,"2. 제26조제1항을 위반한 자"]],"spo:48":[[0,"제48조(벌칙) 다음 각 호의 어느 하나에 해당하는 자는 5년 이하의 징역이나 5천만원 이하의 벌금에 처한다."],[2,"1. 제14조의3의 재물이나 재산상의 이익을 약속ㆍ제공 또는 제공할 의사를 표시한 자(「초ㆍ중등교육법」 제2조에 따른 학교의 학생선수는 제외한다)"],[2,"2. 제14조의3을 위반한 전문체육선수등(「초ㆍ중등교육법」 제2조에 따른 학교의 학생선수는 제외한다)"],[2,"3. 제26조제1항의 금지행위를 이용하여 도박을 한 자"],[2,"4. 제26조제2항제1호에 해당하는 행위를 한 자"],[2,"5. 제30조제2항을 위반한 자"],[2,"5의2. 제35조의3제2항을 위반하여 자료 또는 정보를 조회ㆍ사용ㆍ제공한 사람"],[2,"6. 속임수나 위력을 사용하여 체육진흥투표권 발행 대상 운동경기의 공정한 시행을 방해한 자"]],"tour:5":[[0,"제5조(허가와 신고)"],[1,"①제3조제1항제5호에 따른 카지노업을 경영하려는 자는 전용영업장 등 문화체육관광부령으로 정하는 시설과 기구를 갖추어 문화체육관광부장관의 허가를 받아야 한다."],[1,"②제3조제1항제6호에 따른 테마파크업 중 대통령령으로 정하는 테마파크업을 경영하려는 자는 문화체육관광부령으로 정하는 시설과 설비를 갖추어 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장의 허가를 받아야 한다."],[1,"③제1항과 제2항에 따라 허가받은 사항 중 문화체육관광부령으로 정하는 중요 사항을 변경하려면 변경허가를 받아야 한다. 다만, 경미한 사항을 변경하려면 변경신고를 하여야 한다."],[1,"④제2항에 따라 대통령령으로 정하는 테마파크업 외의 테마파크업을 경영하려는 자는 문화체육관광부령으로 정하는 시설과 설비를 갖추어 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장에게 신고하여야 한다. 신고한 사항 중 문화체육관광부령으로 정하는 중요 사항을 변경하려는 경우에도 또한 같다."],[1,"⑤ 문화체육관광부장관 또는 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장은 제3항 단서에 따른 변경신고나 제4항에 따른 신고 또는 변경신고를 받은 경우 그 내용을 검토하여 이 법에 적합하면 신고를 수리하여야 한다."],[1,"⑥제1항부터 제5항까지의 규정에 따른 허가 및 신고의 절차 등에 필요한 사항은 문화체육관광부령으로 정한다."]],"tour:81":[[0,"제81조(벌칙)"],[1,"① 다음 각 호의 어느 하나에 해당하는 자는 7년 이하의 징역 또는 7천만원 이하의 벌금에 처한다. 이 경우 징역과 벌금은 병과(倂科)할 수 있다."],[2,"1. 제5조제1항에 따른 카지노업의 허가를 받지 아니하고 카지노업을 경영한 자"],[2,"2. 제26조의2를 위반한 자(제1호에 해당하는 자는 제외한다)"],[1,"② 제28조제1항제1호 또는 제2호를 위반한 자는 5년 이하의 징역 또는 5천만원 이하의 벌금에 처한다. 이 경우 징역과 벌금은 병과할 수 있다."],[1,"③ 제1항의 미수범은 처벌한다."]],"youth:2":[[0,"제2조(정의) 이 법에서 사용하는 용어의 뜻은 다음과 같다."],[2,"5. \"청소년유해업소\"란 청소년의 출입과 고용이 청소년에게 유해한 것으로 인정되는 다음 가목의 업소(이하 \"청소년 출입ㆍ고용금지업소\"라 한다)와 청소년의 출입은 가능하나 고용이 청소년에게 유해한 것으로 인정되는 다음 나목의 업소(이하 \"청소년고용금지업소\"라 한다)를 말한다. 이 경우 업소의 구분은 그 업소가 영업을 할 때 다른 법령에 따라 요구되는 허가ㆍ인가ㆍ등록ㆍ신고 등의 여부와 관계없이 실제로 이루어지고 있는 영업행위를 기준으로 한다."],[3,"가. 청소년 출입ㆍ고용금지업소"],[3,"1) 「게임산업진흥에 관한 법률」에 따른 일반게임제공업 및 복합유통게임제공업 중 대통령령으로 정하는 것"],[3,"2) 「사행행위 등 규제 및 처벌 특례법」에 따른 사행행위영업"],[3,"3) 「식품위생법」에 따른 식품접객업 중 대통령령으로 정하는 것"],[3,"4) 「영화 및 비디오물의 진흥에 관한 법률」 제2조제16호에 따른 비디오물감상실업ㆍ제한관람가비디오물소극장업 및 복합영상물제공업"],[3,"5) 삭제"],[3,"6) 「체육시설의 설치ㆍ이용에 관한 법률」에 따른 무도학원업 및 무도장업"],[3,"7) 전기통신설비를 갖추고 불특정한 사람들 사이의 음성대화 또는 화상대화를 매개하는 것을 주된 목적으로 하는 영업. 다만, 「전기통신사업법」 등 다른 법률에 따라 통신을 매개하는 영업은 제외한다."],[3,"8) 불특정한 사람 사이의 신체적인 접촉 또는 은밀한 부분의 노출 등 성적 행위가 이루어지거나 이와 유사한 행위가 이루어질 우려가 있는 서비스를 제공하는 영업으로서 청소년보호위원회가 결정하고 성평등가족부장관이 고시한 것"],[3,"9) 청소년유해매체물 및 청소년유해약물등을 제작ㆍ생산ㆍ유통하는 영업 등 청소년의 출입과 고용이 청소년에게 유해하다고 인정되는 영업으로서 대통령령으로 정하는 기준에 따라 청소년보호위원회가 결정하고 성평등가족부장관이 고시한 것"],[3,"10) 「한국마사회법」 제6조제2항에 따른 장외발매소"],[3,"11) 「경륜ㆍ경정법」 제9조제2항에 따른 장외매장"],[3,"나. 청소년고용금지업소"],[3,"1) 삭제"],[3,"2) 「공중위생관리법」에 따른 숙박업, 목욕장업, 이용업 중 대통령령으로 정하는 것"],[3,"3) 「식품위생법」에 따른 식품접객업 중 대통령령으로 정하는 것"],[3,"4) 「영화 및 비디오물의 진흥에 관한 법률」에 따른 비디오물소극장업"],[3,"5) 「화학물질관리법」에 따른 유해화학물질 영업. 다만, 유해화학물질 사용과 직접 관련이 없는 영업으로서 대통령령으로 정하는 영업은 제외한다."],[3,"6) 회비 등을 받거나 유료로 만화를 빌려 주는 만화대여업"],[3,"7) 청소년유해매체물 및 청소년유해약물등을 제작ㆍ생산ㆍ유통하는 영업 등 청소년의 고용이 청소년에게 유해하다고 인정되는 영업으로서 대통령령으로 정하는 기준에 따라 청소년보호위원회가 결정하고 성평등가족부장관이 고시한 것"],[3,"8) 「음악산업진흥에 관한 법률」에 따른 노래연습장업"]],"youth:28":[[0,"제28조(청소년유해약물등의 판매ㆍ대여 등의 금지)"],[1,"① 누구든지 청소년을 대상으로 청소년유해약물등을 판매ㆍ대여ㆍ배포(자동기계장치ㆍ무인판매장치ㆍ통신장치를 통하여 판매ㆍ대여ㆍ배포하는 경우를 포함한다)하거나 무상으로 제공하여서는 아니 된다. 다만, 교육ㆍ실험 또는 치료를 위한 경우로서 대통령령으로 정하는 경우는 예외로 한다."],[1,"② 누구든지 청소년의 의뢰를 받아 청소년유해약물등을 구입하여 청소년에게 제공하여서는 아니 된다."],[1,"③ 누구든지 청소년에게 권유ㆍ유인ㆍ강요하여 청소년유해약물등을 구매하게 하여서는 아니 된다."],[1,"④ 청소년유해약물등을 판매ㆍ대여ㆍ배포하고자 하는 자는 대통령령으로 정하는 방법에 따라 그 상대방의 나이 및 본인 여부를 확인하여야 한다."],[1,"⑤ 다음 각 호의 어느 하나에 해당하는 자가 청소년유해약물 중 주류나 담배(이하 \"주류등\"이라 한다)를 판매ㆍ대여ㆍ배포하는 경우 그 업소(자동기계장치ㆍ무인판매장치를 포함한다)에 청소년을 대상으로 주류등의 판매ㆍ대여ㆍ배포를 금지하는 내용을 표시하여야 한다. 다만, 청소년 출입ㆍ고용금지업소는 제외한다."],[2,"1. 「주류 면허 등에 관한 법률」에 따른 주류소매업의 영업자"],[2,"2. 「담배사업법」에 따른 담배소매업의 영업자"],[2,"3. 그 밖에 대통령령으로 정하는 업소의 영업자"],[1,"⑥ 성평등가족부장관은 청소년유해약물등 목록표를 작성하여 청소년유해약물등과 관련이 있는 관계기관등에 통보하여야 하고, 필요한 경우 약물 유통을 업으로 하는 개인ㆍ법인ㆍ단체에 통보할 수 있으며, 친권자등의 요청이 있는 경우 친권자등에게 통지할 수 있다."],[1,"⑦ 다음 각 호의 어느 하나에 해당하는 자는 청소년유해약물등에 대하여 청소년유해표시를 하여야 한다."],[2,"1. 청소년유해약물을 제조ㆍ수입한 자"],[2,"2. 청소년유해물건을 제작ㆍ수입한 자"],[1,"⑧ 제6항에 따른 청소년유해약물등 목록표의 작성 방법, 통보 시기, 통보 대상, 그 밖에 필요한 사항은 성평등가족부령으로 정한다."],[1,"⑨ 제5항에 따른 표시의 문구, 크기와 제7항에 따른 청소년유해표시의 종류와 시기ㆍ방법, 그 밖에 필요한 사항은 대통령령으로 정한다."],[1,"⑩ 청소년유해약물등의 포장에 관하여는 제14조 및 제15조를 준용한다. 이 경우 \"청소년유해매체물\" 및 \"매체물\"은 각각 \"청소년유해약물등\"으로 본다."]],"youth:29":[[0,"제29조(청소년 고용 금지 및 출입 제한 등)"],[1,"① 청소년유해업소의 업주는 청소년을 고용하여서는 아니 된다. 청소년유해업소의 업주가 종업원을 고용하려면 미리 나이를 확인하여야 한다."],[1,"② 청소년 출입ㆍ고용금지업소의 업주와 종사자는 출입자의 나이를 확인하여 청소년이 그 업소에 출입하지 못하게 하여야 한다."],[1,"③ 제2조제5호나목2)의 숙박업을 운영하는 업주는 종사자를 배치하거나 대통령령으로 정하는 설비 등을 갖추어 출입자의 나이를 확인하고 제30조제8호의 우려가 있는 경우에는 청소년의 출입을 제한하여야 한다."],[1,"④ 청소년유해업소의 업주와 종사자는 제1항부터 제3항까지에 따른 나이 확인을 위하여 필요한 경우 주민등록증(모바일 주민등록증을 포함한다)이나 그 밖에 나이를 확인할 수 있는 증표(이하 이 항에서 \"증표\"라 한다)의 제시를 요구할 수 있으며, 증표 제시를 요구받고도 정당한 사유 없이 증표를 제시하지 아니하는 사람에게는 그 업소의 출입을 제한할 수 있다."],[1,"⑤ 제2항에도 불구하고 청소년이 친권자등을 동반할 때에는 대통령령으로 정하는 바에 따라 출입하게 할 수 있다. 다만, 「식품위생법」에 따른 식품접객업 중 대통령령으로 정하는 업소의 경우에는 출입할 수 없다."],[1,"⑥ 청소년유해업소의 업주는 그 업소에 대통령령으로 정하는 바에 따라 청소년의 출입과 고용을 제한하는 내용을 표시하여야 한다."]],"youth:58":[[0,"제58조(벌칙) 다음 각 호의 어느 하나에 해당하는 자는 3년 이하의 징역 또는 3천만원 이하의 벌금에 처한다."],[2,"1. 영리를 목적으로 제16조제1항을 위반하여 청소년에게 청소년유해매체물을 판매ㆍ대여ㆍ배포하거나 시청ㆍ관람ㆍ이용하도록 제공한 자"],[2,"2. 영리를 목적으로 제22조를 위반하여 청소년을 대상으로 청소년유해매체물을 유통하게 한 자"],[2,"3. 제28조제1항을 위반하여 청소년에게 제2조제4호가목4)ㆍ5)의 청소년유해약물 또는 같은 호 나목1)ㆍ2)의 청소년유해물건을 판매ㆍ대여ㆍ배포(자동기계장치ㆍ무인판매장치ㆍ통신장치를 통하여 판매ㆍ대여ㆍ배포한 경우를 포함한다)한 자"],[2,"4. 제29조제1항을 위반하여 청소년을 청소년유해업소에 고용한 자"],[2,"5. 제30조제7호부터 제9호까지의 위반행위를 한 자"],[2,"6. 제44조제1항을 위반하여 청소년유해매체물 또는 청소년유해약물등을 수거하지 아니한 자"]],"youth:59":[[0,"제59조(벌칙) 다음 각 호의 어느 하나에 해당하는 자는 2년 이하의 징역 또는 2천만원 이하의 벌금에 처한다."],[2,"1. 제13조제1항 및 제28조제7항을 위반하여 청소년유해매체물 또는 청소년유해약물등에 청소년유해표시를 하지 아니한 자"],[2,"2. 제14조(제28조제10항에서 준용하는 경우를 포함한다)를 위반하여 청소년유해매체물 또는 청소년유해약물등을 포장하지 아니한 자"],[2,"3. 제18조를 위반하여 청소년유해매체물을 방송한 자"],[2,"4. 제19조제1항을 위반하여 청소년유해매체물로서 제2조제2호차목에에 해당하는 매체물 중 「옥외광고물 등의 관리와 옥외광고산업 진흥에 관한 법률」에 따른 옥외광고물을 청소년 출입ㆍ고용금지업소 외의 업소나 일반인들이 통행하는 장소에 공공연하게 설치ㆍ부착 또는 배포한 자 또는 상업적 광고선전물을 청소년의 접근을 제한하는 기능이 없는 컴퓨터 통신을 통하여 설치ㆍ부착 또는 배포한 자"],[2,"5. 삭제"],[2,"6. 제28조제1항을 위반하여 청소년에게 제2조제4호가목1)ㆍ2)의 청소년유해약물 또는 같은 호 나목3)의 청소년유해물건을 판매ㆍ대여ㆍ배포(자동기계장치ㆍ무인판매장치ㆍ통신장치를 통하여 판매ㆍ대여ㆍ배포한 경우를 포함한다)하거나 영리를 목적으로 무상 제공한 자"],[2,"7. 제28조제2항을 위반하여 청소년의 의뢰를 받아 제2조제4호가목1)ㆍ2)의 청소년유해약물을 구입하여 청소년에게 제공한 자"],[2,"7의2. 영리를 목적으로 제28조제3항을 위반하여 청소년에게 청소년유해약물등을 구매하게 한 자"],[2,"7의3. 제28조제5항을 위반하여 주류등의 판매ㆍ대여ㆍ배포를 금지하는 내용을 표시하지 아니한 자"],[2,"8. 제29조제2항을 위반하여 청소년을 청소년 출입ㆍ고용금지업소에 출입시킨 자"],[2,"9. 제29조제6항을 위반하여 청소년유해업소에 청소년의 출입과 고용을 제한하는 내용을 표시하지 아니한 자"]],"ydec:5":[[0,"제5조(청소년 출입ㆍ고용금지업소의 범위)"],[1,"① 법 제2조제5호가목1)에서 \"대통령령으로 정하는 것\"이란 다음 각 호의 어느 하나에 해당하는 영업을 말한다."],[2,"1. 일반게임제공업"],[2,"2. 복합유통게임제공업. 다만, 둘 이상의 업종(1개의 기기에서 게임, 노래연습, 영화감상 등 다양한 콘텐츠를 제공하는 경우는 제외한다)을 같은 장소에서 영업하는 경우로서 제1호의 업소 및 법 제2조제5호가목2)부터 9)까지의 청소년 출입ㆍ고용금지업소가 포함되지 아니한 업소는 청소년의 출입을 허용한다."],[1,"② 법 제2조제5호가목3)에서 \"대통령령으로 정하는 것\"이란 단란주점영업 및 유흥주점영업을 말한다."],[1,"③ 삭제"],[1,"④ 법 제2조제5호가목9)에서 \"청소년의 출입과 고용이 청소년에게 유해하다고 인정되는 영업으로서 대통령령으로 정하는 기준\"이란 다음 각 호의 어느 하나에 해당하는 것을 말한다."],[2,"1. 영업의 형태나 목적이 주로 성인을 대상으로 한 술ㆍ노래ㆍ춤의 제공 등 유흥접객행위가 이루어지는 영업일 것"],[2,"2. 주로 성인용의 매체물을 유통하는 영업일 것"],[2,"3. 청소년유해매체물ㆍ청소년유해약물등을 제작ㆍ생산ㆍ유통하는 영업 중 청소년의 출입ㆍ고용이 청소년의 심신발달에 장애를 초래할 우려가 있는 영업일 것"]],"health:9":[[0,"제9조(금연을 위한 조치)"],[1,"① 삭제"],[1,"②담배사업법에 의한 지정소매인 기타 담배를 판매하는 자는 대통령령이 정하는 장소외에서 담배자동판매기를 설치하여 담배를 판매하여서는 아니된다."],[1,"③제2항의 규정에 따라 대통령령이 정하는 장소에 담배자동판매기를 설치하여 담배를 판매하는 자는 보건복지부령이 정하는 바에 따라 성인인증장치를 부착하여야 한다."],[1,"④ 다음 각 호의 공중이 이용하는 시설의 소유자ㆍ점유자 또는 관리자는 해당 시설의 전체를 금연구역으로 지정하고 금연구역을 알리는 표지를 설치하여야 한다. 이 경우 흡연자를 위한 흡연실을 설치할 수 있으며, 금연구역을 알리는 표지와 흡연실을 설치하는 기준ㆍ방법 등은 보건복지부령으로 정한다."],[2,"1. 국회의 청사"],[2,"2. 정부 및 지방자치단체의 청사"],[2,"3. 「법원조직법」에 따른 법원과 그 소속 기관의 청사"],[2,"4. 「공공기관의 운영에 관한 법률」에 따른 공공기관의 청사"],[2,"5. 「지방공기업법」에 따른 지방공기업의 청사"],[2,"6. 「유아교육법」ㆍ「초ㆍ중등교육법」에 따른 학교[교사(校舍)와 운동장 등 모든 구역을 포함한다]"],[2,"6의2. 「대안교육기관에 관한 법률」에 따른 대안교육기관(교사와 운동장 등 모든 구역을 포함한다)"],[2,"7. 「고등교육법」에 따른 학교의 교사"],[2,"8. 「의료법」에 따른 의료기관, 「지역보건법」에 따른 보건소ㆍ보건의료원ㆍ보건지소"],[2,"9. 「영유아보육법」에 따른 어린이집"],[2,"10. 「청소년활동 진흥법」에 따른 청소년수련관, 청소년수련원, 청소년문화의집, 청소년특화시설, 청소년야영장, 유스호스텔, 청소년이용시설 등 청소년활동시설"],[2,"11. 「도서관법」에 따른 도서관"],[2,"12. 「어린이놀이시설 안전관리법」에 따른 어린이놀이시설"],[2,"13. 「학원의 설립ㆍ운영 및 과외교습에 관한 법률」에 따른 학원 중 학교교과교습학원과 연면적 1천제곱미터 이상의 학원"],[2,"14. 공항ㆍ여객부두ㆍ철도역ㆍ여객자동차터미널 등 교통 관련 시설의 대기실ㆍ승강장, 지하보도 및 16인승 이상의 교통수단으로서 여객 또는 화물을 유상으로 운송하는 것"],[2,"15. 「자동차관리법」에 따른 어린이운송용 승합자동차"],[2,"16. 연면적 1천제곱미터 이상의 사무용건축물, 공장 및 복합용도의 건축물"],[2,"17. 「공연법」에 따른 공연장으로서 객석 수 300석 이상의 공연장"],[2,"18. 「유통산업발전법」에 따라 개설등록된 대규모점포와 같은 법에 따른 상점가 중 지하도에 있는 상점가"],[2,"19. 「관광진흥법」에 따른 관광숙박업소"],[2,"20. 「체육시설의 설치ㆍ이용에 관한 법률」에 따른 체육시설로서 1천명 이상의 관객을 수용할 수 있는 체육시설과 같은 법 제10조에 따른 체육시설업에 해당하는 체육시설로서 실내에 설치된 체육시설"],[2,"21. 「사회복지사업법」에 따른 사회복지시설"],[2,"22. 「공중위생관리법」에 따른 목욕장"],[2,"23. 「게임산업진흥에 관한 법률」에 따른 청소년게임제공업소, 일반게임제공업소, 인터넷컴퓨터게임시설제공업소 및 복합유통게임제공업소"],[2,"24. 「식품위생법」에 따른 식품접객업 중 영업장의 넓이가 보건복지부령으로 정하는 넓이 이상인 휴게음식점영업소, 일반음식점영업소 및 제과점영업소와 같은 법에 따른 식품소분ㆍ판매업 중 보건복지부령으로 정하는 넓이 이상인 실내 휴게공간을 마련하여 운영하는 식품자동판매기 영업소"],[2,"25. 「청소년보호법」에 따른 만화대여업소"],[2,"26. 그 밖에 보건복지부령으로 정하는 시설 또는 기관"],[1,"⑤ 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장은 「주택법」 제2조제3호에 따른 공동주택의 거주 세대 중 2분의 1 이상이 그 공동주택의 복도, 계단, 엘리베이터 및 지하주차장의 전부 또는 일부를 금연구역으로 지정하여 줄 것을 신청하면 그 구역을 금연구역으로 지정하고, 금연구역임을 알리는 안내표지를 설치하여야 한다. 이 경우 금연구역 지정 절차 및 금연구역 안내표지 설치 방법 등은 보건복지부령으로 정한다."],[1,"⑥ 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장은 흡연으로 인한 피해 방지와 주민의 건강 증진을 위하여 다음 각 호에 해당하는 장소를 금연구역으로 지정하고, 금연구역임을 알리는 안내표지를 설치하여야 한다. 이 경우 금연구역 안내표지 설치 방법 등에 필요한 사항은 보건복지부령으로 정한다."],[2,"1. 「유아교육법」에 따른 유치원 시설의 경계선으로부터 30미터 이내의 구역(일반 공중의 통행ㆍ이용 등에 제공된 구역을 말한다)"],[2,"2. 「영유아보육법」에 따른 어린이집 시설의 경계선으로부터 30미터 이내의 구역(일반 공중의 통행ㆍ이용 등에 제공된 구역을 말한다)"],[2,"3. 「초ㆍ중등교육법」에 따른 학교 시설의 경계선으로부터 30미터 이내의 구역(일반 공중의 통행ㆍ이용 등에 제공된 구역을 말한다)"],[1,"⑦ 지방자치단체는 흡연으로 인한 피해 방지와 주민의 건강 증진을 위하여 필요하다고 인정하는 경우 조례로 다수인이 모이거나 오고가는 관할 구역 안의 일정한 장소를 금연구역으로 지정할 수 있다."],[1,"⑧ 누구든지 제4항부터 제7항까지의 규정에 따라 지정된 금연구역에서 흡연하여서는 아니 된다."],[1,"⑨ 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장은 제4항 각 호에 따른 시설의 소유자ㆍ점유자 또는 관리자가 다음 각 호의 어느 하나에 해당하면 일정한 기간을 정하여 그 시정을 명할 수 있다."],[2,"1. 제4항 전단을 위반하여 금연구역을 지정하지 아니하거나 금연구역을 알리는 표지를 설치하지 아니한 경우"],[2,"2. 제4항 후단에 따른 금연구역을 알리는 표지 또는 흡연실의 설치 기준ㆍ방법 등을 위반한 경우"]],"health:34":[[0,"제34조(과태료)"],[1,"①다음 각 호의 어느 하나에 해당하는 자에게는 500만원 이하의 과태료를 부과한다."],[2,"1. 거짓이나 그 밖의 부정한 방법으로 제6조의2제1항에 따른 인증을 받은 자"],[2,"1의2. 제6조의2제4항을 위반하여 인증표시 또는 이와 유사한 표시를 한 자"],[2,"1의3. 제9조제2항의 규정에 위반하여 담배자동판매기를 설치하여 담배를 판매한 자"],[2,"2. 제9조제9항에 따른 시정명령을 따르지 아니한 자"],[2,"3. 제9조의3을 위반하여 가향물질을 표시하는 문구나 그림ㆍ사진을 제품의 포장이나 광고에 사용한 자"],[2,"4. 제23조제2항의 규정에 위반하여 자료를 제출하지 아니하거나 허위의 자료를 제출한 자"],[1,"②다음 각호의 1에 해당하는 자는 300만원 이하의 과태료에 처한다."],[2,"1. 제9조제3항의 규정에 위반하여 성인인증장치가 부착되지 아니한 담배자동판매기를 설치하여 담배를 판매한 자"],[2,"2. 삭제"],[2,"3. 제28조의 규정에 의한 보고를 하지 아니하거나 허위로 보고한 자와 관계공무원의 검사를 거부ㆍ const LAWCODE = {"게임산업법":"game","형법":"crim","형사소송법":"proc","사행행위규제법":"sah","국민체육진흥법":"spo","관광진흥법":"tour","청소년보호법":"youth","청소년보호법 시행령":"ydec","국민건강증진법":"health"};
const LREF = /((?:게임산업법|형사소송법|형법|사행행위규제법|국민체육진흥법|관광진흥법|청소년보호법(?:\s*시행령)?|국민건강증진법|시행령)\s*)?§(\d+)(?:의(\d+))?([①-⑳])?(\d+(?:의\d+)?)?(?:\s+(\d+(?:의\d+)?)호)?|(시행령\s*)?별표\s?2/g;
function L(html, def){
  let cur = def || "game";
  return String(html).replace(LREF, (m, pre, no, ui, para, ho1, ho2, pre2) => {
    if(!no){ return LAWTXT["gdec:별표2"] ? `<a class="lref" data-k="gdec:별표2">${m}</a>` : m; }
    let code = cur;
    if(pre){
      const p = pre.trim().replace(/\s+/g," ");
      if(p === "시행령") code = (cur === "youth" || cur === "ydec") ? "ydec" : "gdec";
      else { code = LAWCODE[p] || cur; cur = code; }
    }
    const key = `${code}:${no}${ui?"-"+ui:""}`;
    if(!LAWTXT[key]) return m;
    const ho = ho1 || ho2 || "";
    return `<a class="lref" data-k="${key}" data-p="${para||""}" data-h="${ho}">${m}</a>`;
  });
}
const codeOf = lawName => LAWCODE[lawName] || "game";

const sheet = $("#sheet"), shbg = $("#shbg");
let sheetPushed = false;
function openLaw(key, para, ho){
  const lines = LAWTXT[key]; if(!lines) return;
  const [code, art] = key.split(":");
  const info = LAWTXT._laws[code];
  $("#shL").textContent = info[0];
  const title = lines[0] && lines[0][0]===0 ? lines[0][1].replace(/\).*$/, ")") : (art==="별표2"?"별표 2":"");
  $("#shT").textContent = art==="별표2" ? "[별표 2] 게임물 관련사업자 준수사항" : title;
  // 강조할 줄 찾기
  const hl = new Set();
  let from = 0, to = lines.length;
  if(para){
    const i = lines.findIndex(l => l[0]===1 && l[1].startsWith(para));
    if(i >= 0){ from = i; to = lines.findIndex((l,j)=> j>i && l[0]===1); if(to<0) to = lines.length; if(!ho) hl.add(i); }
  }
  if(ho){
    for(let j=from;j<to;j++){
      if(lines[j][0]===2 && lines[j][1].startsWith(ho+".")){
        hl.add(j);
        for(let k=j+1;k<to && lines[k][0]===3;k++) hl.add(k);
        break;
      }
    }
  }
  $("#shB").innerHTML = lines.map((l,i)=>`<div class="ln l${l[0]}${hl.has(i)?" hl":""}">${esc(l[1])}</div>`).join("")
    + (art==="별표2" ? `<p class="small muted">원문 표의 줄바꿈을 이어 붙이는 과정에서 띄어쓰기가 일부 다를 수 있습니다.</p>` : "");
  $("#shD").textContent = `현행 원문 · 확인일 ${META.checked}`;
  const nm = info[0].replace(/\s+/g,"");
  const jo = art==="별표2" ? "" : "/제"+art.replace(/-(\d+)/,"조의$1").replace(/^(\d+)$/,"$1조");
  $("#shA").href = `https://www.law.go.kr/법령/${encodeURIComponent(nm)}${jo?encodeURI(jo):""}`;
  sheet.classList.add("on"); shbg.classList.add("on");
  document.body.style.overflow = "hidden";
  const first = $("#shB .hl"); $("#shB").scrollTop = 0;
  if(first) first.scrollIntoView({block:"center"});
  if(!sheetPushed){ history.pushState({sheet:1}, ""); sheetPushed = true; }
}
function closeLaw(fromPop){
  if(!sheet.classList.contains("on")) return;
  sheet.classList.remove("on"); shbg.classList.remove("on");
  document.body.style.overflow = "";
  if(sheetPushed){ sheetPushed = false; if(!fromPop) history.back(); }
}
document.addEventListener("click", e=>{
  const a = e.target.closest("a.lref"); if(!a) return;
  e.preventDefault(); e.stopPropagation();
  openLaw(a.dataset.k, a.dataset.p, a.dataset.h);
}, true);
$("#shX").onclick = ()=>closeLaw();
shbg.onclick = ()=>closeLaw();
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeLaw(); });
window.addEventListener("popstate", ()=>{ if(sheet.classList.contains("on")) closeLaw(true); });

function vCard(id, open){
  const v = V[id]; if(!v) return "";
  const c = codeOf(v.law);
  return `<details class="v" id="v-${id}"${open?" open":""}>
    <summary><span class="t">${esc(v.t)}<small>${L(esc(v.base),c)} · ${esc(v.who)}</small></span>${bd(v.k)}</summary>
    <div class="kv">
      <div><span>근거</span><span>${L(esc(v.base),c)}</span></div>
      <div><span>제재</span><span><b>${L(esc(v.pen),c)}</b></span></div>
      <div><span>증거</span><span>${v.ev.map(x=>L(esc(x),c)).join("<br>")}</span></div>
      ${v.tip?`<div><span>유의</span><span>${L(esc(v.tip),c)}</span></div>`:""}
    </div></details>`;
}
function vChip(id){ const v=V[id]; return v?`<a class="chip" href="#v-${id}" data-v="${id}">${esc(v.t.length>22?v.t.slice(0,22)+"…":v.t)}</a>`:""; }

    <div style="background:var(--gray-soft)">손님이 개인적으로 접속, 업주 관여 없음 → <b>업주 책임 단정 금지</b> (차단 프로그램 설치 여부만 별도)</div>
    <div style="background:var(--red-soft)">불법 게임 설치·계정·머니 제공 → <b>게임산업법 §32①1·4·9</b></div>
    <div style="background:var(--red-soft)">충전·환전·수수료 → <b>§32①7 · §28①2 · 형법 §247</b></div>
  </div>
  <h3>체포·압수 유의 (형사소송법)</h3>
  <div class="card small"><ul class="tight">
    <li><b>현행범 체포</b>(형사소송법 §211·§212): 범죄가 명백하고 체포 필요성(도망·증거인멸 염려)이 있을 때. 50만원 이하 벌금·구류·과료에 해당하는 죄는 주거 불분명 시에만(§214).</li>
    <li><b>체포 현장 압수</b>(§216①2) 후 계속 압수가 필요하면 지체 없이 영장 신청, 검사 청구는 체포한 때부터 48시간 이내(§217②). 범행 중·직후 범죄 장소 긴급 압수는 §216③.</li>
    <li><b>임의제출</b>(§218): 제출자의 자발성·제출 범위를 기록.</li>
    <li>요건이 애매하면 무리하지 말고 <b>증거 보존 + 수사부서 인계</b>.</li>
  </ul><p class="muted">세부 운용은 소속 관서·수사부서 지침이 우선합니다.</p></div>
  <h3>어디에 통보하나</h3>
  <div class="tbl"><table>
    <tr><th>기관</th><th>무엇을</th></tr>
    <tr><td>시·군·구 (게임 담당)</td><td>허가·등록 확인, 과태료, 영업정지 등 행정처분, 폐쇄·봉인(게임산업법 §38)</td></tr>
    <tr><td>게임물관리위원회</td><td>등급분류 여부, 등급거부, 개변조 기술 확인</td></tr>
    <tr><td>생활질서계</td><td>사행성 게임장·환전·도박장 수사</td></tr>
    <tr><td>사이버수사팀</td><td>온라인 도박·사설토토·아이템 사기</td></tr>
    <tr><td>보건소</td><td>금연구역 흡연</td></tr>
    <tr><td>학교전담경찰관</td><td>청소년 도박·반복 출입</td></tr>
  </table></div>
  <h3>112 종결 문안 예시</h3>
  ${memos.map((m,i)=>`<div class="card small"><button class="copy" data-c="${i}">복사</button><b>${m[0]}</b><div class="quote" id="m${i}">${esc(m[1])}</div></div>`).join("")}
  <h3>증거 기록 체크</h3>
  <div class="card small"><ul class="tight">
    <li>발견 시각, PC·기기 번호, 위치</li><li>화면 전체 + 게임명·버전·URL·실행파일 경로</li>
    <li>등급 표시·필증·등급번호</li><li>충전·환전 장부, 계좌·문자·메신저(임의제출 범위 기록)</li>
    <li>업주·종업원·손님 진술(누가 설치·제공·정산했는지)</li><li>허가증·등록증 사진</li>
  </ul></div>`);
  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{
    const t=$("#m"+b.dataset.c).textContent;
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{b.textContent="복사됨";setTimeout(()=>b.textContent="복사",1200)}).catch(()=>{b.textContent="길게 눌러 복사"});
  });
}

function law(filter){
  setTitle("법조 총괄표");
  const f = filter||"all";
  const ids = Object.keys(V).filter(id=>f==="all"||V[id].k===f);
  const groups = {};
  ids.forEach(id=>{(groups[V[id].law]=groups[V[id].law]||[]).push(id);});
  app.innerHTML = `
  <div class="filter" id="flt">
    ${[["all","전체"],["c","형사처벌"],["f","과태료"],["a","행정처분"]].map(([k,n])=>`<button data-f="${k}" class="${f===k?"on":""}">${n}</button>`).join("")}
  </div>
  ${Object.entries(groups).map(([g,list])=>`<div class="sec-label">${g} (${list.length})</div>${list.map(id=>vCard(id)).join("")}`).join("")}
  <div class="card small muted">↓ 표기: ‘2년↓/2천만원↓’ = 2년 이하 징역 또는 2천만원 이하 벌금. 법령 기준일은 <a href="#about">기준일·사용법</a> 참고.</div>`;
  $("#flt").onclick=e=>{const b=e.target.closest("button"); if(b){history.replaceState(null,"","#law"+(b.dataset.f==="all"?"":"?f="+b.dataset.f)); law(b.dataset.f);} };
}

function cases(){
  setTitle("단속·판결 사례");
  app.innerHTML = `
  <div class="box warn small"><b>‘단속 사례가 있는 이름’</b> 목록입니다. 이름만으로 불법이 확정되지 않습니다. 같은 이름의 등급받은 정상 게임이 있을 수 있으므로 게임명·버전·실제 프로그램을 특정하고 게임물관리위원회에 확인하세요. 판결을 인용할 때는 판결문 원문을 대조하세요.</div>
  <div class="list">${CASES.map(c=>`<div class="item"><span class="tx"><b>${esc(c[0])}</b><span>${esc(c[1])}</span><span>${esc(c[2])}</span></span></div>`).join("")}</div>`;
}

function about(){
  setTitle("기준일·사용법");
  app.innerHTML = `
  <h2>법령 기준</h2>
  <div class="tbl"><table><tr><th>법령</th><th>기준</th></tr>${META.laws.map(l=>`<tr><td>${l[0]}</td><td>${l[1]}</td></tr>`).join("")}</table></div>
  <p class="small muted">국가법령정보센터 현행 원문 대조 · 확인일 ${META.checked}. 법령이 바뀌면 이 문서도 바뀌어야 합니다.</p>
  <h2>휴대폰에서 쓰는 법</h2>
  <div class="card small"><ul class="tight">
    <li><b>홈 화면에 추가</b>: 크롬 ⋮ → ‘홈 화면에 추가’ / 사파리 공유 → ‘홈 화면에 추가’.</li>
    <li>이 파일 하나로 동작하며 외부 서버를 부르지 않습니다. 파일로 받아도 열 수 있습니다.</li>
    <li>체크리스트 표시는 이 화면을 닫으면 사라집니다(개인정보를 저장하지 않음).</li>
    <li>상단 🔍로 ‘환전’, ‘청소년’, ‘§32’ 같은 단어를 검색할 수 있습니다.</li>
  </ul></div>
  <div class="box warn small">이 매뉴얼은 현장 판단을 돕는 참고자료입니다. 최종 법률 판단은 법령 원문, 판례, 소속 관서·수사부서 지침을 따르세요.</div>`;
}

function search(q){
  setTitle("검색");
  q = (q||"").trim();
  if(!q){ app.innerHTML = `<p class="muted">검색어를 입력하세요.</p>`; return; }
  const terms = q.toLowerCase().split(/\s+/);
  const has = t => terms.every(w => t.toLowerCase().includes(w));
  const vs = Object.keys(V).filter(id=>{const v=V[id];return has([v.t,v.base,v.pen,v.law,v.tip||"",v.ev.join(" ")].join(" "));});
  const ps = P.filter(p=>has([p.n,p.s,p.basis,p.idf.join(" "),p.chk.map(c=>c.join(" ")).join(" "),p.mis.join(" ")].join(" ")));
  const ss = S.map((s,i)=>[s,i]).filter(([s])=>has([s.t,s.see.join(" "),s.fork.flat().join(" "),s.act].join(" ")));
  app.innerHTML = `
  <p class="small muted">‘${esc(q)}’ — 장소 ${ps.length} · 상황 ${ss.length} · 위반유형 ${vs.length}</p>
  ${ps.length?`<div class="sec-label">장소</div><div class="list">${ps.map(p=>`<a class="item" href="#place/${p.id}"><span class="ic">${p.ic}</span><span class="tx"><b>${p.n}</b><span>${p.s}</span></span><span class="ar">›</span></a>`).join("")}</div>`:""}
  ${ss.length?`<div class="sec-label">상황</div><div class="list">${ss.map(([s,i])=>`<a class="item" href="#scen/${i}"><span class="tx"><b>${esc(s.t)}</b></span><span class="ar">›</span></a>`).join("")}</div>`:""}
  ${vs.length?`<div class="sec-label">위반유형</div>${vs.map(id=>vCard(id)).join("")}`:""}
  ${!ps.length&&!ss.length&&!vs.length?`<p>결과가 없습니다. 더 짧은 단어로 검색해 보세요.</p>`:""}`;
}

/* ========================= 라우터 ========================= */
function setTitle(t){ $("#ttl").textContent=t; document.title = t==="게임신고 현장매뉴얼"?t:t+" · 게임신고 현장매뉴얼"; }
function route(){
  const h = location.hash.slice(1) || "home";
  const [path, qs] = h.split("?");
  const params = new URLSearchParams(qs||"");
  const [a,b] = path.split("/");
  if(a.startsWith("v-")) return; // 페이지 안 위반유형 앵커
  const top = {home:"home",places:"places",place:"places",scen:"scen",flow:"flow",law:"law"}[a]||"";
  document.querySelectorAll("#nav a").forEach(x=>x.classList.toggle("on",x.dataset.n===top));
  $("#back").style.display = (a==="home")?"none":"block";
  if(a!=="search"){ $("#sbar").style.display="none"; }
  ({home, places, place:()=>place(b), scen:()=>b!==undefined?scen(+b):scenList(params.get("f")), flow, law:()=>law(params.get("f")), cases, about, search:()=>search(params.get("q"))}[a]||home)();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);

/* 칩 → 같은 화면의 위반유형 카드로 이동·펼침 */
app.addEventListener("click", e=>{
  const c = e.target.closest("a[data-v]"); if(!c) return;
  e.preventDefault();
  const d = document.getElementById("v-"+c.dataset.v);
  if(d){ d.open=true; d.scrollIntoView({behavior:"smooth",block:"start"}); d.classList.remove("flash"); void d.offsetWidth; d.classList.add("flash"); }
});

$("#back").onclick = ()=>{ if(history.length>1) history.back(); else location.hash="#home"; };
$("#sbtn").onclick = ()=>{
  const bar=$("#sbar"); const show = bar.style.display!=="block";
  bar.style.display = show?"block":"none";
  if(show){ $("#q").focus(); }
};
let tmr; $("#q").addEventListener("input", e=>{ clearTimeout(tmr); tmr=setTimeout(()=>{ history.replaceState(null,"","#search?q="+encodeURIComponent(e.target.value)); search(e.target.value); document.querySelectorAll("#nav a").forEach(x=>x.classList.remove("on")); $("#back").style.display="block"; },200); });

/* 화면 밝기 전환 (기기 설정 → 어둡게 → 밝게) */
(function(){
  const root=document.documentElement; let m=null;
  try{ m=localStorage.getItem("theme"); }catch(e){}
  if(m) root.dataset.theme=m;
  $("#theme").onclick=()=>{
    const dark = root.dataset.theme ? root.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark?"light":"dark";
    try{ localStorage.setItem("theme",root.dataset.theme); }catch(e){}
  };
})();

route();
</script>
</body>
</html>
